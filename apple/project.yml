# XcodeGen spec — generates Tankmate.xcodeproj (committable, diff-able).
# Regenerate after editing:  cd apple && xcodegen generate
#
# Tankmate native is a thin SwiftUI shell around the SAME web app that ships to
# tankmate.joanmarcriera.es. The PWA files in the repo ROOT are the single source
# of truth for the verdict engine; scripts/prepare-web-bundle.py copies them into
# the built .app at build time (see postBuildScripts below). Nothing is
# duplicated into apple/, so the engine can never drift between web and native.
name: Tankmate
options:
  bundleIdPrefix: uk.co.riera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Left empty on purpose: CI and local release builds inject the real Team ID
    # via `DEVELOPMENT_TEAM=<id>` on the xcodebuild line, so the repo carries no
    # account identity (same rule as Distavo).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
targets:
  Tankmate:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    configFiles:
      Debug: configs/AppStore.xcconfig
      Release: configs/AppStore.xcconfig
    settings:
      base:
        PRODUCT_NAME: Tankmate
        GENERATE_INFOPLIST_FILE: YES
        # Merged into the generated plist — holds UILaunchScreen, which has no
        # INFOPLIST_KEY_* equivalent.
        INFOPLIST_FILE: Tankmate-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Tankmate
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Joan Marc Riera Duocastella"
        # The web app has no light theme, so pin the whole app dark — this also
        # gives the light status-bar content the dark header needs.
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        # prepare-web-bundle.py writes into the built product; Xcode's script
        # sandbox would block that.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Runs after Copy Bundle Resources and before code signing, so the web
      # payload is inside the signed bundle. Always out of date: the inputs live
      # outside the project directory and Xcode cannot track them.
      - name: Bundle the Tankmate web app
        script: |
          "$PROJECT_DIR/scripts/prepare-web-bundle.py" \
            "$PROJECT_DIR/.." \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/web"
        basedOnDependencyAnalysis: false
  # UI tests are the only way to prove the native bridge works end to end: the
  # bell lives in the web content, the sheet is SwiftUI, and nothing but a real
  # tap crosses that boundary.
  TankmateUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Tankmate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.riera.tankmate.uitests
        TEST_TARGET_NAME: Tankmate
schemes:
  Tankmate:
    build:
      targets:
        Tankmate: all
        TankmateUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TankmateUITests
    archive:
      config: Release
