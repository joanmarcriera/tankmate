    <path d="M120 300 q60-120 180-120 q70 0 110 60 l50-40 v200 l-50-40 q-40 60-110 60 q-120 0-180-120 z" fill="#22d3ee"/>
    <circle cx="300" cy="250" r="14" fill="#0b1416"/>
    <path d="M70 230 q30 26 0 52 q-26-26 0-52z" fill="#34d399"/>
  </g>
</svg>
