name: unit-tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check the browser scripts
        run: |
          for f in app.js cycling.js tanks.js nudge.js sw.js; do
            if [ -f "$f" ]; then node --check "$f"; else echo "skip $f (not in repo)"; fi
          done
      # Node 22 does not expand a bare directory argument; the glob matches tests/*.test.mjs.
      - run: node --test 'tests/*.test.mjs'
