name: Release (iOS App Store upload)

# Archives Tankmate for iOS, exports an App Store .ipa, and uploads it to App
# Store Connect (TestFlight). It does NOT submit for review: that is a separate,
# human-approved step (see apple/docs/APP-STORE-CONNECT.md section 4 and the
# `mac-appstore-submission-api` skill; the submission state machine is the same
# on iOS). Adapted from distavo/.github/workflows/release-appstore.yml, minus the
# macOS-only parts (installer cert, .pkg, sandbox entitlement).
#
# Triggers: tag `ios-v*` or manual dispatch. It deliberately does NOT run on a
# push to `main`: main auto-deploys the live PWA and must stay independent of
# the native release. Note workflow_dispatch only works once this file exists on
# the default branch; to test from a feature branch, push an `ios-v*` tag on it.
#
# Required repo secrets (Marc adds these; see apple/docs/APP-STORE-CONNECT.md s3):
#   APPLE_TEAM_ID                              10-char Team ID
#   APPLE_DISTRIBUTION_CERT_P12_BASE64         base64 of the "Apple Distribution" .p12
#   APPLE_DISTRIBUTION_CERT_PASSWORD           password of that .p12
#   IOS_APP_STORE_PROVISIONING_PROFILE_BASE64  base64 of the iOS App Store .mobileprovision
#   ASC_API_KEY_ID, ASC_API_ISSUER_ID          App Store Connect API key identifiers
#   ASC_API_KEY_P8_BASE64                      base64 of AuthKey_XXXX.p8 (App Manager role)

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion override (default: the run number)"
        required: false

concurrency:
  group: release-appstore-ios
  cancel-in-progress: false

jobs:
  upload-appstore:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
      ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
      BUNDLE_ID: uk.co.riera.tankmate
      # Every upload needs a build number higher than the last; the run number
      # only ever grows, so it is safe without querying App Store Connect.
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Preflight - required secrets present
        run: |
          missing=()
          for s in APPLE_TEAM_ID APPLE_DISTRIBUTION_CERT_P12_BASE64 APPLE_DISTRIBUTION_CERT_PASSWORD \
                   IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 \
                   ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            [ -n "${!s:-}" ] || missing+=("$s")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]} - see apple/docs/APP-STORE-CONNECT.md section 3"
            exit 1
          fi
        env:
          APPLE_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          APPLE_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}

      - name: Install xcodegen
        run: brew install xcodegen

      # One throwaway keychain per run. iOS needs only the Apple Distribution
      # identity (no installer cert: an .ipa is not a .pkg). set-key-partition-list
      # is what lets codesign use the key without an interactive prompt.
      - name: Import signing certificate
        timeout-minutes: 5
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12_BASE64 }}
          CERT_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist-cert.p12"
          security import "$RUNNER_TEMP/dist-cert.p12" -k "$KEYCHAIN" -P "$CERT_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security default-keychain -d user -s "$KEYCHAIN"
          existing="$(security list-keychains -d user | sed s/\"//g)"
          # shellcheck disable=SC2086  # word-splitting the keychain list is intended
          security list-keychains -d user -s "$KEYCHAIN" $existing
          rm -f "$RUNNER_TEMP/dist-cert.p12"

          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk '/"Apple Distribution:/{print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::No 'Apple Distribution' identity found in the temporary keychain"
            security find-identity -v "$KEYCHAIN" || true
            exit 1
          fi
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        timeout-minutes: 3
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # altool and xcodebuild look here; -authenticationKeyPath is not reliable.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"

      # Validate the profile BEFORE the 20-minute archive: wrong team, wrong app
      # id, or a development profile are the usual first-run failures.
      - name: Install iOS App Store provisioning profile
        timeout-minutes: 3
        env:
          PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/tankmate.mobileprovision"
          plist="$RUNNER_TEMP/tankmate-profile.plist"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$src"
          security cms -D -i "$src" > "$plist"
          pb() { /usr/libexec/PlistBuddy -c "Print $1" "$plist" 2>/dev/null || true; }

          uuid="$(pb UUID)"; name="$(pb Name)"; team="$(pb TeamIdentifier:0)"
          app_id="$(pb Entitlements:application-identifier)"
          task_allow="$(pb Entitlements:get-task-allow)"
          devices="$(pb ProvisionedDevices)"

          if [[ "$team" != "$APPLE_TEAM_ID" ]]; then
            echo "::error::Profile belongs to team '$team', expected '$APPLE_TEAM_ID'"; exit 1
          fi
          if [[ "$app_id" != "${APPLE_TEAM_ID}.${BUNDLE_ID}" ]]; then
            echo "::error::Profile app id is '$app_id', expected '${APPLE_TEAM_ID}.${BUNDLE_ID}'"; exit 1
          fi
          if [[ "$task_allow" == "true" || -n "$devices" ]]; then
            echo "::error::Profile is a development/ad-hoc profile; use an App Store Connect (iOS) distribution profile"
            exit 1
          fi

          dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$dir"
          cp "$src" "$dir/$uuid.mobileprovision"
          { echo "PROFILE_UUID=$uuid"; echo "PROFILE_NAME=$name"; } >> "$GITHUB_ENV"
          echo "Installed provisioning profile '$name' ($uuid)"

      - name: Generate project
        run: cd apple && xcodegen generate

      # Manual signing, identity and profile pinned. The Team ID is injected here
      # so the repo carries no account identity (project.yml leaves it empty).
      - name: Archive
        timeout-minutes: 30
        run: |
          set -euo pipefail
          cd apple
          xcodebuild archive \
            -project Tankmate.xcodeproj -scheme Tankmate \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Tankmate.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

          app="build/Tankmate.xcarchive/Products/Applications/Tankmate.app"
          [[ -f "$app/embedded.mobileprovision" ]] || { echo "::error::Archived app has no embedded.mobileprovision"; exit 1; }
          # The privacy manifest is what lets 'Data Not Collected' be true; ship nothing without it.
          [[ -f "$app/PrivacyInfo.xcprivacy" ]] || { echo "::error::Archived app is missing PrivacyInfo.xcprivacy"; exit 1; }
          # The bundled web payload must exist and must not contain the external checkout
          # (App Review Guideline 3.1.1); prepare-web-bundle.py already fails the build on
          # this, so this is a belt-and-braces check on the finished artefact.
          [[ -f "$app/web/index.html" ]] || { echo "::error::Archived app has no bundled web/index.html"; exit 1; }
          if grep -rqi 'lemonsqueezy' "$app/web"; then
            echo "::error::External checkout link survived in the bundled web payload (Guideline 3.1.1)"; exit 1
          fi

      - name: Export the .ipa
        timeout-minutes: 15
        run: |
          set -euo pipefail
          cd apple
          # Comments live OUTSIDE the heredoc: '#' inside <<PLIST is literal plist text.
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>${SIGNING_IDENTITY}</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          plutil -lint build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Tankmate.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export
          ipa="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          [[ -n "$ipa" ]] || { echo "::error::Export produced no .ipa"; find build/export -print; exit 1; }
          unzip -l "$ipa" | grep -q 'embedded.mobileprovision' || { echo "::error::.ipa has no embedded.mobileprovision"; exit 1; }
          echo "Exported $ipa"

      - name: Upload to App Store Connect
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cd apple
          ipa="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          log="$RUNNER_TEMP/altool-upload.log"
          set +e
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::altool upload failed (exit $status)"; exit "$status"
          fi
          # altool exits 0 on 'accepted with warnings'. A green run must mean a clean delivery.
          if grep -Eq 'ITMS-[0-9]+|WARNING|Validation failed' "$log"; then
            echo "::error::Upload reported warnings or validation errors; see the log above"
            exit 1
          fi
          echo "Uploaded. Check TestFlight in App Store Connect before submitting for review."

      - name: Keep the archive and export (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tankmate-ios-build
          path: |
            apple/build/export/*.ipa
            apple/build/export/*.plist
            apple/build/export/*.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Remove the throwaway keychain and key material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
