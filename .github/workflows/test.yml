name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # rsync ships on ubuntu-latest, so the end-to-end deploy-filter case runs here.
      - run: rsync --version | head -1
      - run: node --test 'tests/*.test.mjs'
